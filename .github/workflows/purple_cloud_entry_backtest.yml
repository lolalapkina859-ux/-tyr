name: Purple Cloud Entry Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Purple Cloud entry test
        run: python -m backtest.purple_cloud_entry_test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-entry-results
          path: |
            backtest/data/purple_cloud_entry_summary.csv
            backtest/data/purple_cloud_entry_detail.csv
          if-no-files-found: warn
