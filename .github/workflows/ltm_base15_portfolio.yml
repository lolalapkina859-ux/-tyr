name: LTM Current 15 Portfolio
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run current 15 with LTM
        run: python -m backtest.ltm_base15_portfolio
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltm-current15-portfolio-results
          path: backtest/data/ltm_base15_*.csv
          if-no-files-found: ignore
