name: Purple Cloud Zero Lag OOS Halves

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run OOS halves
        run: python -m backtest.pc_zerolag_oos_halves
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-zerolag-oos-halves-results
          path: backtest/data/pc_zerolag_oos_halves_*.csv
          if-no-files-found: ignore
