name: First Retest After BOS Backtest

on:
  push:
    branches: [main]
    paths:
      - "backtest/first_retest_after_bos_test.py"
      - ".github/workflows/first_retest_after_bos.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run first retest after BOS test
        run: python -m backtest.first_retest_after_bos_test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-retest-after-bos-results
          path: |
            backtest/data/first_retest_after_bos_summary.csv
            backtest/data/first_retest_after_bos_detail.csv
            backtest/data/btc_first_retest_after_bos_detail.csv
            backtest/data/eth_first_retest_after_bos_detail.csv
            backtest/data/zec_first_retest_after_bos_detail.csv
