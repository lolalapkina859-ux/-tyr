name: Purple Cloud P40 A0.9 Test

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests

      - name: Run Purple Cloud P40 test
        run: |
          python -m backtest.pc_base15_p40_a09_bp1_sp1

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-p40-a09-results
          path: |
            backtest/data/pc_base15_p40_a09_bp1_sp1_trades.csv
            backtest/data/pc_base15_p40_a09_bp1_sp1_by_symbol.csv
          if-no-files-found: ignore
