name: Purple Cloud - BASE13 TP Level Sweep Partial33 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run TP level sweep
        run: python -m backtest.pc_base13_tp_level_sweep_partial33_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base13-tp-level-sweep-partial33-results
          path: |
            backtest/data/pc_base13_tp_level_sweep_partial33_summary.csv
            backtest/data/pc_base13_tp_level_sweep_partial33_trades.csv
