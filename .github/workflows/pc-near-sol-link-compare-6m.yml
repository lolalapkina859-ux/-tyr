name: Purple Cloud - BASE13 NEAR SOL LINK 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run portfolio comparison
        run: python -m backtest.pc_near_sol_link_compare_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base13-near-sol-link-6m-results
          path: |
            backtest/data/pc_near_sol_link_compare_6m_summary.csv
            backtest/data/pc_near_sol_link_compare_6m_trades.csv
            backtest/data/pc_near_sol_link_compare_6m_equity.csv
            backtest/data/pc_near_sol_link_compare_6m_failures.csv
          if-no-files-found: warn
