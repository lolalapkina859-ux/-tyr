name: Lorentzian ABCD Test
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout backtest repo
        uses: actions/checkout@v4

      - name: Checkout Lorentzian Classification
        uses: actions/checkout@v4
        with:
          repository: artificial-intelligence-edge/lorentzian-classification
          path: vendor/lorentzian-classification

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Validate Lorentzian
        run: PYTHONPATH=vendor/lorentzian-classification/ports/python python -m lorentzian_classification validate-fixtures

      - name: Run Purple Cloud vs Lorentzian A B C D
        run: python -m backtest.pc_lorentzian_abcd_base15_30m_6m

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-abcd-results
          path: |
            backtest/data/pc_lorentzian_abcd_base15_30m_6m_summary.csv
            backtest/data/pc_lorentzian_abcd_base15_30m_6m_trades.csv
          if-no-files-found: warn
