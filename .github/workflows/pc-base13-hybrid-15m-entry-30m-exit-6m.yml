name: Purple Cloud - BASE13 Hybrid 15M Entry 30M Exit

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run hybrid test
        run: python -m backtest.pc_base13_hybrid_15m_entry_30m_exit_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base13-hybrid-15m-entry-30m-exit-results
          path: |
            backtest/data/pc_base13_hybrid_15m_entry_30m_exit_summary.csv
            backtest/data/pc_base13_hybrid_15m_entry_30m_exit_trades.csv
            backtest/data/pc_base13_hybrid_15m_entry_30m_exit_equity.csv
            backtest/data/pc_base13_hybrid_15m_entry_30m_exit_by_symbol.csv
            backtest/data/pc_base13_hybrid_15m_entry_30m_exit_failures.csv
