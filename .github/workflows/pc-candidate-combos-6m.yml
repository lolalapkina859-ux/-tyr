name: Purple Cloud - 16 Candidate Combos 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run all 16 candidate combinations
        run: |
          python -m backtest.pc_candidate_combos_6m

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-16-candidate-combos-6m-results
          path: |
            backtest/data/pc_candidate_combos_6m_summary.csv
            backtest/data/pc_candidate_combos_6m_trades.csv
            backtest/data/pc_candidate_combos_6m_failures.csv
          if-no-files-found: warn
