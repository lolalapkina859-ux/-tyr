name: Purple Cloud SOL 30M Backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run SOL Purple Cloud 30m
        run: python -m backtest.purple_cloud_sol_30m_test
      - uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-sol-30m-results
          path: |
            backtest/data/purple_cloud_sol_30m_summary.csv
            backtest/data/purple_cloud_sol_30m_detail.csv
