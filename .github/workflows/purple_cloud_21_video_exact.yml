name: Purple Cloud 2.1 VIDEO EXACT

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run Purple Cloud 2.1 video test
        run: python -m backtest.pc21_video_exact_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-21-video-exact-results
          path: |
            backtest/data/pc21_video_exact_*.csv
          if-no-files-found: ignore
