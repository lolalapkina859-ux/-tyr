name: Purple Cloud - BRUSDT Previous 6M OOS

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run BRUSDT previous 6M OOS
        run: python -m backtest.pc_br_oos_prev6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-brusdt-previous-6m-oos-results
          path: |
            backtest/data/pc_br_oos_prev6m_summary.csv
            backtest/data/pc_br_oos_prev6m_trades.csv
          if-no-files-found: warn
