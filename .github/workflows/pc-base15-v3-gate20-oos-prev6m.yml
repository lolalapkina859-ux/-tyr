name: Purple Cloud - BASE15 V3 Gate20 Previous 6M OOS
on:
  workflow_dispatch:
    inputs:
      start_balance:
        description: Starting balance USDT
        required: true
        default: '145.58352658'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run previous 6M OOS
        env:
          PC_TEST_START_BALANCE: ${{ inputs.start_balance }}
        run: python -m backtest.pc_base15_v3_gate20_oos_prev6m
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base15-v3-gate20-prev6m-oos-results
          path: |
            backtest/data/pc_base15_v3_gate20_oos_prev6m_summary.csv
            backtest/data/pc_base15_v3_gate20_oos_prev6m_trades.csv
          if-no-files-found: warn
