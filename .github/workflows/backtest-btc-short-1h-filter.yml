name: BTC SHORT Score Sweep Fast
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Run SHORT score sweep
        run: python -m backtest.filter_btc_short_score --out backtest_btc_short_score_sweep.csv
      - uses: actions/upload-artifact@v4
        with:
          name: btc-short-score-sweep-fast
          path: backtest_btc_short_score_sweep.csv
