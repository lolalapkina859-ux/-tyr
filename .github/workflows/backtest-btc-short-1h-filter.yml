name: BTC SHORT Stop Sweep Fast

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Replay SHORT stop widths
        run: |
          python -m backtest.short_stop_sweep \
            --symbol BTCUSDT \
            --baseline backtest/data/backtest_btc_ob_filtered_1_10.csv \
            --start "2026-03-01T00:00:00+00:00" \
            --end "2026-09-01T00:00:00+00:00" \
            --out backtest_btc_short_stop_sweep.csv
      - uses: actions/upload-artifact@v4
        with:
          name: btc-short-stop-sweep-fast
          path: backtest_btc_short_stop_sweep.csv
