name: BTC SHORT 1H Filter Fast

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SHORT-only 1H filter
        run: |
          python -m backtest.filter_short_by_1h \
            --baseline backtest/data/backtest_btc_ob_filtered_1_10.csv \
            --start "2026-03-01T00:00:00+00:00" \
            --end "2026-09-01T00:00:00+00:00" \
            --out backtest_btc_short_1h_filter.csv

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: btc-short-1h-filter-fast
          path: backtest_btc_short_1h_filter.csv
