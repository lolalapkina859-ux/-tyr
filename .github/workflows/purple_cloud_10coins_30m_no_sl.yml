name: Purple Cloud 10 Coins 30M No SL
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m backtest.purple_cloud_10coins_30m_no_sl
      - uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-10coins-30m-no-sl-results
          path: |
            backtest/data/purple_cloud_10coins_30m_no_sl_summary.csv
            backtest/data/purple_cloud_10coins_30m_no_sl_detail.csv
