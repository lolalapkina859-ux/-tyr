name: BTC Historical Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date"
        required: false
        default: "2024-01-01T00:00:00+00:00"
      end:
        description: "UTC end date"
        required: false
        default: "2026-09-01T00:00:00+00:00"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MIN_SIGNAL_SCORE: "70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BTC backtest
        run: |
          python -m backtest.run_btc \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-backtest-results
          path: backtest_btc_results.csv
          if-no-files-found: ignore
