name: Purple Cloud V2 List Compare
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run Purple Cloud comparison
        run: python -m backtest.pc_v2_list_compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purple-cloud-v2-list-compare-results
          path: backtest/data/pc_v2_list_compare_*.csv
          if-no-files-found: ignore
