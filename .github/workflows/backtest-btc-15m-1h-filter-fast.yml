name: BTC 15M + 1H Filter Fast

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run fast 1H filter test
        run: |
          python -m backtest.filter_15m_by_1h \
            --baseline backtest/data/backtest_btc_ob_filtered_1_10.csv \
            --start '2026-03-01T00:00:00+00:00' \
            --end '2026-09-01T00:00:00+00:00' \
            --out backtest_btc_15m_1h_filter.csv
      - uses: actions/upload-artifact@v4
        with:
          name: btc-15m-1h-filter-fast
          path: backtest_btc_15m_1h_filter.csv
