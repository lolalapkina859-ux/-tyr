name: Purple Cloud - 13 vs 14 vs 15 vs 16 vs 17

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run 13 to 17 portfolio comparison
        run: |
          python -m backtest.pc13_to_17_compare_6m

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-13-to-17-compare-6m-results
          path: |
            backtest/data/pc13_to_17_compare_6m_summary.csv
            backtest/data/pc13_to_17_compare_6m_trades.csv
            backtest/data/pc13_to_17_compare_6m_equity.csv
            backtest/data/pc13_to_17_compare_6m_failures.csv
          if-no-files-found: warn
