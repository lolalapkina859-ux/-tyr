name: Pure Zero Lag Next Signal

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run pure Zero Lag test
        run: python -m backtest.zero_lag_pure_next_signal
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-zero-lag-next-signal-results
          path: backtest/data/zero_lag_pure_next_signal_*.csv
          if-no-files-found: ignore
