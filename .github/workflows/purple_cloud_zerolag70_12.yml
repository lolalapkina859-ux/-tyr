name: Purple Cloud + Zero Lag 70 1.2

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests
      - name: Run backtest
        run: python -m backtest.pc_base15_zerolag70_12
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-zerolag70-12-results
          path: backtest/data/pc_base15_zerolag70_12_*.csv
          if-no-files-found: ignore
