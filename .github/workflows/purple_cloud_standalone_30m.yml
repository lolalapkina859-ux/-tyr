name: Purple Cloud Standalone 30M Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run Purple Cloud 30M standalone test
        run: python -m backtest.purple_cloud_standalone_30m_test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-standalone-30m-results
          path: |
            backtest/data/purple_cloud_standalone_30m_summary.csv
            backtest/data/purple_cloud_standalone_30m_detail.csv
          if-no-files-found: warn
