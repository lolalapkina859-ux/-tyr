name: Purple Cloud SOL 30M SL3 Opposite
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m backtest.purple_cloud_sol_30m_sl3_opposite
      - uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-sol-30m-sl3-opposite-results
          path: |
            backtest/data/purple_cloud_sol_30m_sl3_opposite_summary.csv
            backtest/data/purple_cloud_sol_30m_sl3_opposite_detail.csv
