name: Purple Cloud - NEAR SOL Monthly 6M
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run monthly breakdown
        run: python -m backtest.pc_near_sol_monthly_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-near-sol-monthly-6m-results
          path: |
            backtest/data/pc_near_sol_monthly_6m_summary.csv
            backtest/data/pc_near_sol_monthly_6m_trades.csv
            backtest/data/pc_near_sol_monthly_6m_failures.csv
          if-no-files-found: warn
