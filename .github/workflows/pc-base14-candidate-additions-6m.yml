name: Purple Cloud - BASE14 Candidate Additions 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run BASE14 candidate additions comparison
        run: python -m backtest.pc_base14_candidate_additions_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base14-candidate-additions-6m-results
          path: |
            backtest/data/pc_base14_candidate_additions_summary.csv
            backtest/data/pc_base14_candidate_additions_trades.csv
            backtest/data/pc_base14_candidate_additions_by_symbol.csv
          if-no-files-found: warn
