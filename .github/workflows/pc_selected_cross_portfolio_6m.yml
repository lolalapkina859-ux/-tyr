name: PC30 Selected Unified CROSS 6M
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m backtest.pc_selected_cross_portfolio_6m
      - uses: actions/upload-artifact@v4
        with:
          name: pc30-selected-unified-cross-6m-results
          path: |
            backtest/data/pc_selected_cross_6m_summary.csv
            backtest/data/pc_selected_cross_6m_trades.csv
            backtest/data/pc_selected_cross_6m_equity.csv
            backtest/data/pc_selected_cross_6m_by_symbol.csv
            backtest/data/pc_selected_cross_6m_failures.csv
