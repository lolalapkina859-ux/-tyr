name: Purple Cloud - BASE13 TP3 Fraction Sweep 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run TP3 fraction sweep
        run: python -m backtest.pc_base13_tp3_fraction_sweep_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base13-tp3-fraction-sweep-results
          path: |
            backtest/data/pc_base13_tp3_fraction_sweep_summary.csv
            backtest/data/pc_base13_tp3_fraction_sweep_trades.csv
