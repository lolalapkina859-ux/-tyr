name: Purple Cloud - New Universe 6M

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Purple Cloud New Universe 6M
        run: |
          python -m backtest.pc_new_universe_6m

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-new-universe-6m-results
          path: |
            backtest/data/pc_new_universe_6m_summary.csv
            backtest/data/pc_new_universe_6m_ranking.csv
            backtest/data/pc_new_universe_6m_winners.csv
            backtest/data/pc_new_universe_6m_skipped.csv
            backtest/data/pc_new_universe_6m_detail.csv
          if-no-files-found: warn
