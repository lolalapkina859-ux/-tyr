name: Purple Cloud - BASE15 Timeframe Comparison 6M
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run timeframe comparison
        run: python -m backtest.pc_base15_timeframe_comparison_6m
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purple-cloud-base15-timeframe-comparison-6m-results
          path: |
            backtest/data/pc_base15_timeframe_comparison_6m_summary.csv
            backtest/data/pc_base15_timeframe_comparison_6m_trades.csv
          if-no-files-found: warn
