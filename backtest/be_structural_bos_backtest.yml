name: BE Structural BOS Backtest

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BE structural BOS cross-asset test
        run: python -m backtest.be_structural_bos_test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-structural-bos-results
          path: |
            backtest/data/be_structural_bos_summary.csv
            backtest/data/be_structural_bos_detail.csv
